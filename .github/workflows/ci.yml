name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: typecheck + test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: shebang survives compile
        run: |
          first="$(head -n 1 dist/cli.js)"
          test "$first" = "#!/usr/bin/env node"
      - name: packed bin still has shebang
        run: |
          tgz="$(npm pack --ignore-scripts --pack-destination /tmp | tail -n 1)"
          tar -xOf "/tmp/${tgz}" package/dist/cli.js | head -n 1 | grep -qx '#!/usr/bin/env node'
      - name: CLI smoke
        run: |
          node dist/cli.js --help
          node dist/cli.js --version
          node dist/cli.js --offline --no-color examples/answer.md
          node dist/cli.js --json --offline --prompt examples/prompt.txt --answer examples/answer.md
          printf 'Use Node 20 test runner with node:assert/strict.\n' | node dist/cli.js --offline --no-color --json
          # Test --locale zh shows Chinese labels
          node dist/cli.js --locale zh --offline --no-color examples/answer.md | grep -q '吐槽分'
          # Test --locale en shows English labels
          node dist/cli.js --locale en --offline --no-color examples/answer.md | grep -q 'Roast Score'
          # dumpster-fire fixture scores 100 → must fail below 100, pass at 100
          if node dist/cli.js --offline --no-color --fail-above 50 examples/answer.md; then
            echo "expected --fail-above 50 to exit non-zero" >&2
            exit 1
          fi
          node dist/cli.js --offline --no-color --fail-above 100 examples/answer.md
          # Capture --github output to avoid SIGPIPE from head
          github_out="$(node dist/cli.js --offline --github --max-annotations 2 --no-color examples/answer.md)"
          echo "$github_out" | head -n 5
          # --quiet: annotations only (no pretty group)
          out="$(node dist/cli.js --offline --github --quiet --max-annotations 2 --no-color examples/answer.md)"
          echo "$out" | grep -E '::(error|warning|notice) ' >/dev/null
          ! echo "$out" | grep -q '::group::'
          test -z "$(node dist/cli.js --offline --quiet --no-color examples/answer.md)"
          node dist/cli.js --version | grep -qx '0.1.16'
          # --out smoke tests
          out_file="$(mktemp)"
          node dist/cli.js --offline --no-color --out "$out_file" examples/answer.md
          test -s "$out_file"
          grep -q 'Roast Score' "$out_file"
          grep -q 'burnt offering' "$out_file"
          rm -f "$out_file"
          # --out --json: file gets JSON, stdout also gets JSON
          out_json_file="$(mktemp)"
          json_stdout="$(node dist/cli.js --offline --out "$out_json_file" --json examples/answer.md)"
          test -s "$out_json_file"
          echo "$json_stdout" | grep -q '"score":'
          echo "$json_stdout" | grep -q '"version": "0.1.16"'
          cat "$out_json_file" | grep -q '"score":'
          rm -f "$out_json_file"
          # --html stdout: self-contained report, no CDN
          html_stdout="$(node dist/cli.js --offline --html --no-color examples/answer.md)"
          echo "$html_stdout" | grep -q '<!DOCTYPE html>'
          echo "$html_stdout" | grep -q 'llm-roast'
          echo "$html_stdout" | grep -q 'Roast Score'
          ! echo "$html_stdout" | grep -qiE 'cdn\.|unpkg|jsdelivr|fonts\.googleapis'
          # --html path: write file, do not dump HTML to stdout
          html_dir="$(mktemp -d)"
          html_file="$html_dir/nested/report.html"
          html_path_stdout="$(node dist/cli.js --offline --html "$html_file" --no-color examples/answer.md)"
          test -s "$html_file"
          grep -q '<!DOCTYPE html>' "$html_file"
          grep -q 'Roast Score' "$html_file"
          ! echo "$html_path_stdout" | grep -q '<!DOCTYPE html>'
          rm -rf "$html_dir"
          # --html --json is rejected
          if node dist/cli.js --offline --html --json examples/answer.md; then
            echo "expected --html --json to fail" >&2
            exit 1
          fi
          # Suite mode smoke tests
          suite_out="$(node dist/cli.js --suite examples --json --offline)"
          echo "$suite_out" | grep -q '"version": "0.1.16"'
          echo "$suite_out" | grep -q '"count":'
          count="$(echo "$suite_out" | grep -o '"count": [0-9]*' | grep -o '[0-9]*')"
          test "$count" -ge 2
          # Suite --fail-above should exit 1 when maxScore exceeds threshold
          if node dist/cli.js --suite examples --json --offline --fail-above 30; then
            echo "expected suite --fail-above 30 to exit non-zero" >&2
            exit 1
          fi
          # Suite --fail-above should pass when threshold not exceeded
          node dist/cli.js --suite examples --json --offline --fail-above 100
          # Suite brace expansion smoke test
          brace_out="$(node dist/cli.js --suite 'examples/{answer,bad-answer}.md' --json --offline)"
          echo "$brace_out" | grep -q '"count": 2'
          echo "$brace_out" | grep -q 'answer\.md'
          echo "$brace_out" | grep -q 'bad-answer\.md'
